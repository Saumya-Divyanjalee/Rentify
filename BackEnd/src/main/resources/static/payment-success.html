<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Rentify — Payment Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Roboto+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Roboto Mono',monospace;background:linear-gradient(135deg,#f0f4ff,#fff,#f0fff4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .card{background:#fff;border:1.5px solid #e8eaf2;border-radius:24px;max-width:540px;width:100%;padding:48px 40px;box-shadow:0 16px 56px rgba(10,13,26,.12);text-align:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
        @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
        .logo{font-family:"Bungee",sans-serif;font-size:20px;text-decoration:none;color:#0a0d1a;margin-bottom:28px;display:block;}
        .logo span{color:#1a3fff;}
        .icon{font-size:72px;margin-bottom:20px;animation:bounce .6s ease .2s both;}
        @keyframes bounce{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
        h1{font-family:"Bungee",sans-serif;font-size:26px;color:#0a0d1a;margin-bottom:10px;letter-spacing:-.5px;}
        .sub{font-size:13px;color:#4a5278;line-height:1.7;margin-bottom:24px;}
        .status-box{background:#f0fff4;border:1.5px solid rgba(0,184,107,.3);border-radius:12px;padding:16px 20px;margin-bottom:20px;}
        .status-box .s-icon{font-size:28px;margin-bottom:6px;}
        .status-box .s-title{font-family:"Bungee",sans-serif;font-size:13px;color:#065f46;}
        .status-box .s-sub{font-size:11px;color:#047857;margin-top:4px;}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;text-align:left;}
        .info-box{background:#f8f9fc;border:1px solid #e8eaf2;border-radius:10px;padding:12px 14px;}
        .info-box .lbl{font-family:"Bungee",sans-serif;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#8890b0;margin-bottom:4px;}
        .info-box .val{font-size:12px;font-weight:600;color:#0a0d1a;word-break:break-all;}
        .notice{background:#fffbea;border:1.5px solid rgba(245,197,24,.4);border-radius:12px;padding:14px 18px;margin-bottom:24px;font-size:11px;color:#7a5c00;line-height:1.7;text-align:left;}
        .notice strong{display:block;font-family:"Bungee",sans-serif;font-size:9px;letter-spacing:1px;margin-bottom:4px;}
        .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:12px;font-family:"Bungee",sans-serif;font-size:11px;letter-spacing:.8px;border:none;cursor:pointer;text-decoration:none;transition:.2s;}
        .btn-primary{background:#0a0d1a;color:#fff;}
        .btn-primary:hover{background:#1a3fff;}
        .btn-secondary{background:#f8f9fc;border:1.5px solid #e8eaf2;color:#4a5278;}
        .btn-secondary:hover{border-color:#0a0d1a;color:#0a0d1a;}
        .spin{display:inline-block;width:18px;height:18px;border:2px solid #e8eaf2;border-top-color:#1a3fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="card">
    <a href="#" class="logo" id="logoLink">Rent<span>ify</span></a>

    <div id="loadingBox" style="padding:20px;font-size:12px;color:#8890b0;">
        <span class="spin"></span>Verifying payment…
    </div>

    <div id="content" style="display:none;">
        <div class="icon">🎉</div>
        <h1>Payment Successful!</h1>
        <p class="sub">Your booking is confirmed. The driver will contact you before pickup.</p>

        <div class="status-box">
            <div class="s-icon">✅</div>
            <div class="s-title">Payment Completed</div>
            <div class="s-sub">Your booking is now CONFIRMED</div>
        </div>

        <div class="info-grid" id="infoGrid"></div>

        <div class="notice">
            <strong>📧 Check Your Email</strong>
            A confirmation email has been sent with full booking and payment details.
        </div>

        <div class="actions">
            <!--  Buttons use JavaScript redirect — no hardcoded paths -->
            <button class="btn btn-primary" id="bookAnotherBtn">🚗 Book Another</button>
            <button class="btn btn-secondary" id="dashboardBtn">🏠 Dashboard</button>
        </div>
    </div>
</div>

<script src="../../../../../../Rentify/FrontEnd/js/jquery-3.7.1.min.js"></script>

<script>
    $(function () {
        const API = 'http://localhost:8081/api/v1';

        //  Frontend base URL — IntelliJ server port
        // This is read from localStorage where it was saved during booking
        // Falls back to detecting from referrer or using a known path
        function getFrontendBase() {
            // Try to get from localStorage (saved when user was on vehicle page)
            const saved = localStorage.getItem('rentify_frontend_base');
            if (saved) return saved;
            // Default IntelliJ path
            return 'http://localhost:63342/Rentify/FrontEnd/pages/user';
        }

        //  Save frontend base when on any frontend page
        // (This is called from user-vehicle.html automatically)

        const base = getFrontendBase();

        // Set logo link
        $('#logoLink').attr('href', base + '/user-dashboard.html');

        //  Button click handlers — use full URL
        $('#bookAnotherBtn').on('click', function () {
            window.location.href = base + '/user-vehicle.html';
        });

        $('#dashboardBtn').on('click', function () {
            window.location.href = base + '/user-dashboard.html';
        });

        // Get params
        const orderId   = new URLSearchParams(window.location.search).get('order_id');
        const bookingId = localStorage.getItem('rentify_pendingBookingId');
        const token     = localStorage.getItem('rentify_token');

        // Show order ID immediately
        if (orderId) {
            $('#infoGrid').html(`
            <div class="info-box" style="grid-column:1/-1">
                <div class="lbl">Order ID</div>
                <div class="val" style="color:#1a3fff">${orderId}</div>
            </div>`);
        }

        // Wait 2.5s for PayHere notify → then load payment details
        setTimeout(function () {
            $('#loadingBox').hide();
            $('#content').fadeIn(300);

            if (bookingId && token) {
                $.ajax({
                    url: API + '/payments/booking/' + bookingId,
                    method: 'GET',
                    headers: { Authorization: 'Bearer ' + token },
                    success: function (res) {
                        const p = res.data || res;
                        $('#infoGrid').html(`
                        <div class="info-box" style="grid-column:1/-1">
                            <div class="lbl">Transaction ID</div>
                            <div class="val" style="color:#1a3fff;font-size:11px">${p.transactionId || orderId || '—'}</div>
                        </div>
                        <div class="info-box">
                            <div class="lbl">Amount</div>
                            <div class="val" style="color:#00b86b">Rs ${Number(p.amount || 0).toLocaleString('en-LK')} LKR</div>
                        </div>
                        <div class="info-box">
                            <div class="lbl">Status</div>
                            <div class="val" style="color:#00b86b">${p.status || 'COMPLETED'}</div>
                        </div>
                        <div class="info-box">
                            <div class="lbl">Booking ID</div>
                            <div class="val">BK-${p.bookingId || bookingId}</div>
                        </div>
                        <div class="info-box">
                            <div class="lbl">Method</div>
                            <div class="val">${p.paymentMethod || 'ONLINE'}</div>
                        </div>`);
                        localStorage.removeItem('rentify_pendingBookingId');
                    },
                    error: function () {
                        if (orderId) {
                            $('#infoGrid').html(`
                            <div class="info-box" style="grid-column:1/-1">
                                <div class="lbl">Order ID</div>
                                <div class="val" style="color:#1a3fff">${orderId}</div>
                            </div>`);
                        }
                    }
                });
            }
        }, 2500);
    });
</script>
</body>
</html>
